<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earn AED 2,000 · referral badge</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700&family=Outfit:wght@800&display=swap" rel="stylesheet">
<style>
  :root{--maroon:#6a2135;--cream:#f5ece0;--navy:#051634;--gold:#f7ce78;--gold2:#d9a84a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf6f0;font-family:'Manrope',sans-serif}
  /* ===== S-coin (SVG) ===== */
  .scoin{position:absolute;display:block}
  .scoin svg{display:block;width:100%;height:100%}

  /* ===== badge ===== */
  .badge{position:relative;width:248px;padding:56px 18px 44px;border-radius:22px;background:var(--maroon);color:#fff;display:flex;flex-direction:column;overflow:hidden;text-decoration:none}
  .badge .sum{font-family:'Outfit',sans-serif;font-weight:800;font-size:27px;line-height:1.05;letter-spacing:-.02em;color:var(--gold);white-space:nowrap;position:relative;z-index:2}
  .badge .btn{position:relative;overflow:hidden;margin-top:14px;height:40px;border-radius:12px;background:var(--cream);color:var(--maroon);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;line-height:20px;z-index:2}
  .badge .btn::after{content:'';position:absolute;top:-10px;bottom:-10px;left:0;width:40%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));animation:shimmer 5.6s ease-in-out infinite}
  @keyframes shimmer{0%{transform:translateX(-160%) skewX(-20deg)}18%,100%{transform:translateX(260%) skewX(-20deg)}}
  .badge .pile{position:absolute;left:0;right:0;bottom:0;height:20%;z-index:3}
  .heap{position:absolute;left:0;right:0;bottom:0;width:100%;height:100%;display:block}
  .badge .pile .scoin{bottom:0}

  /* falling coin: flies down to the pile line, flips, fades as a "landed" copy appears */
  @keyframes fall{0%{transform:translateY(0) rotateY(0);opacity:0}8%{opacity:1}100%{transform:translateY(var(--dy)) rotateY(540deg);opacity:1}}
  .badge .sky{position:absolute;inset:0;z-index:1}
  .badge .sky .scoin{top:-16px;animation:fall linear infinite}
  /* pile coins appear one by one over the cycle, then reset */
  @keyframes land{0%{opacity:0;transform:translateY(8px)}6%{opacity:1;transform:translateY(0)}96%{opacity:1}100%{opacity:0}}
  .badge .pile .scoin{animation:none;opacity:1}

  
  @media (prefers-reduced-motion:reduce){.scoin,.btn::after{animation:none!important}}
</style>
</head>
<body>
<a class="badge" id="badge" href="#" aria-label="Refer a friend, earn AED 2,000"><div class="sky"></div><div class="pile"></div><div class="sum">Earn AED 2,000</div><div class="btn">Refer a friend</div></a>
<script>
const scoin = (size, extra='') => `<span class="scoin" style="width:${size}px;height:${size}px;${extra}"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><radialGradient id="g" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffe3a3"/><stop offset=".55" stop-color="#f7ce78"/><stop offset="1" stop-color="#d9a84a"/></radialGradient></defs><circle cx="12" cy="12" r="11.2" fill="url(#g)" stroke="#6a2135" stroke-opacity=".45" stroke-width="1.6"/><circle cx="12" cy="12" r="8.2" fill="none" stroke="#6a2135" stroke-opacity=".3" stroke-width="1"/><text x="12" y="16.3" text-anchor="middle" font-family="Outfit, Montserrat, sans-serif" font-weight="800" font-size="12.5" fill="#6a2135">$</text></svg></span>`;



const moundPath = (w,h,bumps,base) => { let d=`M0 ${h} L0 ${h*(1-base)}`; bumps.forEach(([bx,by],i)=>{ const x=bx*w,y=h-by*h; const px=(i?bumps[i-1][0]:0)*w; const pby=i?bumps[i-1][1]:base; d+=` Q ${(px+x)/2} ${h-Math.max(by,pby)*h*1.05} ${x} ${y}`; }); d+=` Q ${w*0.97} ${h*(1-base)} ${w} ${h*(1-base)} L${w} ${h} Z`; return d; };

const rng = (seed)=>{ let t=seed>>>0; return ()=>{ t+=0x6D2B79F5; let r=Math.imul(t^(t>>>15),1|t); r^=r+Math.imul(r^(r>>>7),61|r); return ((r^(r>>>14))>>>0)/4294967296; }; };
const binHeap = (w,h,id,opts={}) => {
  const R=rng(opts.seed||7); const d=moundPath(w,h,opts.bumps||[[0.1,0.6],[0.25,0.95],[0.42,0.5],[0.55,0.35],[0.7,0.6],[0.85,0.9]],opts.base||0.4);
  const tones=['#ffe3a3','#f7ce78','#edbd63','#d9a84a','#c9953a'];
  let items='';
  const bumpsArr=opts.bumps||[[0.1,0.6],[0.25,0.95],[0.42,0.5],[0.55,0.35],[0.7,0.6],[0.85,0.9]]; const base=opts.base||0.4;
  const yAt=(x)=>{ const b=[[0,1-base],...bumpsArr.map(([bx,by])=>[bx,1-by]),[1,1-base]]; const t=Math.min(1,Math.max(0,x/w)); for(let i=1;i<b.length;i++){ if(t<=b[i][0]){ const k=(t-b[i-1][0])/(b[i][0]-b[i-1][0]); return h*(b[i-1][1]+(b[i][1]-b[i-1][1])*k); } } return h; };
  const minS=opts.min||4, maxS=opts.max||9, avg=(minS+maxS)/2;
  // jittered grid over the whole mound so no background shows through; two passes (back + front)
  const step=avg*0.95; const draw=(x,y,pass)=>{
    const size=minS+R()*(maxS-minS); const tilt=0.35+R()*0.65; const rot=(R()-0.5)*80; const tone=tones[Math.floor(R()*tones.length)]; const kind=R();
    if(kind<0.12){ items+=`<rect x="${(x-size).toFixed(1)}" y="${(y-size*.18).toFixed(1)}" width="${(size*2).toFixed(1)}" height="${(size*.36).toFixed(1)}" rx="${(size*.18).toFixed(1)}" fill="${tone}" stroke="#8a5a1e" stroke-opacity=".6" stroke-width=".7" transform="rotate(${rot.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`; }
    else if(opts.bills && kind<0.17){ items+=`<rect x="${(x-size*1.6).toFixed(1)}" y="${(y-size*.7).toFixed(1)}" width="${(size*3.2).toFixed(1)}" height="${(size*1.4).toFixed(1)}" rx="1" fill="#7fb77e" stroke="#2f6b3a" stroke-width=".7" transform="rotate(${rot.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/><rect x="${(x-size*1.3).toFixed(1)}" y="${(y-size*.45).toFixed(1)}" width="${(size*2.6).toFixed(1)}" height="${(size*.9).toFixed(1)}" rx=".5" fill="none" stroke="#2f6b3a" stroke-opacity=".7" stroke-width=".5" transform="rotate(${rot.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`; }
    else { const rx=size, ry=size*tilt; const sign = size>avg*0.95 && R()<0.55;
      items+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(0)})"><ellipse rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="${tone}" stroke="#8a5a1e" stroke-opacity=".6" stroke-width=".8"/><ellipse rx="${(rx*.66).toFixed(1)}" ry="${(ry*.66).toFixed(1)}" fill="none" stroke="#8a5a1e" stroke-opacity=".3" stroke-width=".6"/>${sign?`<text y="${(ry*.38).toFixed(1)}" text-anchor="middle" font-family="Outfit,sans-serif" font-weight="800" font-size="${(rx*1.05).toFixed(1)}" fill="#6a2135" transform="scale(1 ${tilt.toFixed(2)})">$</text>`:`<ellipse cx="${(-rx*.3).toFixed(1)}" cy="${(-ry*.3).toFixed(1)}" rx="${(rx*.18).toFixed(1)}" ry="${(ry*.18).toFixed(1)}" fill="#fff6dc" opacity=".9"/>`}</g>`; } };
  for(let pass=0;pass<2;pass++){ const off=pass*step/2; for(let gy=-step/2+off; gy<h+step; gy+=step){ for(let gx=-step/2+off; gx<w+step; gx+=step){ const x=gx+(R()-0.5)*step*0.9, y=gy+(R()-0.5)*step*0.9; if(y < yAt(x)-avg*0.6) continue; draw(x,y,pass); } } }
  return `<svg class="heap" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true" style="overflow:visible"><defs><linearGradient id="${id}-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2b45a"/><stop offset="1" stop-color="#9c6a1f"/></linearGradient><clipPath id="${id}-c"><path d="${d}"/></clipPath></defs><path d="${d}" fill="url(#${id}-b)"/><g clip-path="url(#${id}-c)">${items}</g><path d="${d}" fill="none" stroke="#6a2135" stroke-opacity=".3" stroke-width="1"/></svg>`;
};

const b = document.getElementById('badge');
const bsky = b.querySelector('.sky'), bpile = b.querySelector('.pile');
[8,40,75,118,150,186,215,232,60,170].forEach((x,i)=>{
  const d = 12 + (i%3)*3;
  bsky.insertAdjacentHTML('beforeend', scoin(d, `left:${x}px;--dy:${200+d}px;animation-duration:${(4+(i*.7)%3).toFixed(1)}s;animation-delay:${(-(i*1.3)%6).toFixed(1)}s`));
});
bpile.innerHTML = binHeap(248,36,'hb6',{seed:5,cell:16,min:4,max:10});
</script>
</body>
</html>
