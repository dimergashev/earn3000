<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earn AED 2,000 · referral badge</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700&family=Outfit:wght@800&display=swap" rel="stylesheet">
<style>
  :root{--maroon:#6a2135;--cream:#f5ece0;--navy:#051634;--gold:#f7ce78;--gold2:#d9a84a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf6f0;font-family:'Manrope',sans-serif}
  /* ===== S-coin (SVG) ===== */
  .scoin{position:absolute;display:block}
  .scoin svg{display:block;width:100%;height:100%}

  /* ===== badge ===== */
  .badge{position:relative;width:248px;padding:56px 18px 44px;border-radius:22px;background:var(--maroon);color:#fff;display:flex;flex-direction:column;overflow:hidden;text-decoration:none}
  .badge .sum{font-family:'Outfit',sans-serif;font-weight:800;font-size:27px;line-height:1.05;letter-spacing:-.02em;color:var(--gold);white-space:nowrap;position:relative;z-index:2}
  .badge .btn{position:relative;overflow:hidden;margin-top:14px;height:40px;border-radius:12px;background:var(--cream);color:var(--maroon);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;line-height:20px;z-index:2}
  .badge .btn::after{content:'';position:absolute;top:-10px;bottom:-10px;left:0;width:40%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));animation:shimmer 5.6s ease-in-out infinite}
  @keyframes shimmer{0%{transform:translateX(-160%) skewX(-20deg)}18%,100%{transform:translateX(260%) skewX(-20deg)}}
  .badge .pile{position:absolute;left:0;right:0;bottom:0;height:20%;z-index:3}
  .heap{position:absolute;left:0;right:0;bottom:0;width:100%;height:100%;display:block}
  .badge .pile .scoin{bottom:0}

  /* falling coin: flies down to the pile line, flips, fades as a "landed" copy appears */
  @keyframes fall{0%{transform:translateY(0) rotateY(0);opacity:0}8%{opacity:1}100%{transform:translateY(var(--dy)) rotateY(540deg);opacity:1}}
  .badge .sky{position:absolute;inset:0;z-index:1}
  .badge .sky .scoin{top:-16px;animation:fall linear infinite}
  /* pile coins appear one by one over the cycle, then reset */
  @keyframes land{0%{opacity:0;transform:translateY(8px)}6%{opacity:1;transform:translateY(0)}96%{opacity:1}100%{opacity:0}}
  .badge .pile .scoin{animation:none;opacity:1}

  
  @media (prefers-reduced-motion:reduce){.scoin,.btn::after{animation:none!important}}
</style>
</head>
<body>
<a class="badge" id="badge" href="#" aria-label="Refer a friend, earn AED 2,000"><div class="sky"></div><div class="pile"></div><div class="sum">Earn AED 2,000</div><div class="btn">Refer a friend</div></a>
<script>
const scoin = (size, extra='') => `<span class="scoin" style="width:${size}px;height:${size}px;${extra}"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><radialGradient id="g" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffe3a3"/><stop offset=".55" stop-color="#f7ce78"/><stop offset="1" stop-color="#d9a84a"/></radialGradient></defs><circle cx="12" cy="12" r="11.2" fill="url(#g)" stroke="#6a2135" stroke-opacity=".45" stroke-width="1.6"/><circle cx="12" cy="12" r="8.2" fill="none" stroke="#6a2135" stroke-opacity=".3" stroke-width="1"/><text x="12" y="16.3" text-anchor="middle" font-family="Outfit, Montserrat, sans-serif" font-weight="800" font-size="12.5" fill="#6a2135">$</text></svg></span>`;



// Vector heap of gold: mound silhouette filled with a fine pattern of tiny coins
const heap = (w, h, id) => {
  const bumps = [[0.08,0.55],[0.22,0.8],[0.36,0.6],[0.5,0.95],[0.64,0.7],[0.78,0.85],[0.92,0.5]];
  let d = `M0 ${h} L0 ${h*0.55}`;
  bumps.forEach(([bx,by],i)=>{ const x=bx*w, y=h-(by*h); const px=(i?bumps[i-1][0]:0)*w; d+=` Q ${(px+x)/2} ${h-Math.max(by,(i?bumps[i-1][1]:0.55))*h*1.05} ${x} ${y}`; });
  d += ` Q ${w*0.97} ${h*0.6} ${w} ${h*0.6} L${w} ${h} Z`;
  const cs = Math.max(6, Math.round(h*0.22)); // tiny coin cell size
  return `<svg class="heap" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="${id}-base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3a3"/><stop offset=".6" stop-color="#f7ce78"/><stop offset="1" stop-color="#c9953a"/></linearGradient>
    <pattern id="${id}-coins" width="${cs}" height="${cs*0.86}" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <circle cx="${cs*0.3}" cy="${cs*0.3}" r="${cs*0.27}" fill="#f7ce78" stroke="#8a5a1e" stroke-opacity=".55" stroke-width="${cs*0.06}"/>
      <circle cx="${cs*0.22}" cy="${cs*0.22}" r="${cs*0.08}" fill="#fff3cf" opacity=".9"/>
      <circle cx="${cs*0.8}" cy="${cs*0.72}" r="${cs*0.27}" fill="#edbd63" stroke="#8a5a1e" stroke-opacity=".55" stroke-width="${cs*0.06}"/>
      <circle cx="${cs*0.72}" cy="${cs*0.64}" r="${cs*0.08}" fill="#fff3cf" opacity=".9"/>
    </pattern>
    <clipPath id="${id}-clip"><path d="${d}"/></clipPath>
  </defs>
  <path d="${d}" fill="url(#${id}-base)"/>
  <rect x="0" y="0" width="${w}" height="${h}" fill="url(#${id}-coins)" clip-path="url(#${id}-clip)"/>
  <path d="${d}" fill="none" stroke="#6a2135" stroke-opacity=".35" stroke-width="1.2"/>
</svg>`;
};
// badge: 10 falling coins, heap at the bottom
const b = document.getElementById('badge');
const bsky = b.querySelector('.sky'), bpile = b.querySelector('.pile');
[8,40,75,118,150,186,215,232,60,170].forEach((x,i)=>{
  const d = 12 + (i%3)*3;
  bsky.insertAdjacentHTML('beforeend', scoin(d, `left:${x}px;--dy:${200+d}px;animation-duration:${(4+(i*.7)%3).toFixed(1)}s;animation-delay:${(-(i*1.3)%6).toFixed(1)}s`));
});
bpile.innerHTML = heap(248, 36, 'hb');


</script>
</body>
</html>
