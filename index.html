<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earn AED 3,000 · referral badge</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700&family=Outfit:wght@800&display=swap" rel="stylesheet">
<style>
  :root{--maroon:#6a2135;--cream:#f5ece0;--navy:#051634;--gold:#f7ce78;--gold2:#d9a84a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf6f0;font-family:'Manrope',sans-serif}

  /* ===== Referral badge · M2 coins ===== */
  .referral-badge{text-decoration:none;position:relative;width:248px;padding:16px 18px;border-radius:22px;background:var(--maroon);color:#fff;display:flex;flex-direction:column;overflow:hidden;cursor:pointer}
  .referral-badge .tile{width:44px;height:44px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(247,206,120,.18);position:relative;z-index:1;perspective:120px}
  .referral-badge .sum{margin-top:12px;font-family:'Outfit',sans-serif;font-weight:800;font-size:27px;line-height:1.05;letter-spacing:-.02em;color:var(--gold);white-space:nowrap;position:relative;z-index:1}
  .referral-badge .btn{position:relative;overflow:hidden;margin-top:14px;height:40px;border-radius:12px;background:var(--cream);color:var(--maroon);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;line-height:20px;z-index:1}

  /* coin: gold disc with rim and inner ring */
  .coin{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe3a3,var(--gold) 55%,var(--gold2));box-shadow:inset 0 0 0 1.5px rgba(106,33,53,.35)}
  .coin::after{content:'';position:absolute;inset:22%;border-radius:50%;border:1.5px solid rgba(106,33,53,.35)}
  .coinicon{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe3a3,var(--gold) 55%,var(--gold2));box-shadow:inset 0 0 0 2px rgba(106,33,53,.45);position:relative;display:block}
  .coinicon::after{content:'';position:absolute;inset:5px;border-radius:50%;border:2px solid rgba(106,33,53,.45)}

  /* animation: coin rain (continuous), medallion flip + button shimmer (synced, every 5.6 s) */
  @keyframes rain{0%{transform:translateY(-24px) rotateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(190px) rotateY(540deg);opacity:0}}
  @keyframes coinflip{0%{transform:rotateY(0)}18%,100%{transform:rotateY(360deg)}}
  @keyframes shimmer{0%{transform:translateX(-160%) skewX(-20deg)}18%,100%{transform:translateX(260%) skewX(-20deg)}}
  .referral-badge .coin{top:-10px;animation:rain linear infinite}
  .referral-badge .coinicon{animation:coinflip 5.6s ease-in-out infinite}
  .referral-badge .btn::after{content:'';position:absolute;top:-10px;bottom:-10px;left:0;width:40%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));animation:shimmer 5.6s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.referral-badge *,.referral-badge .btn::after{animation:none!important}}
</style>
</head>
<body>

<a class="referral-badge" href="#" aria-label="Refer a friend, earn AED 3,000">
  <span class="coin" style="left:8px;width:6px;height:6px;animation-duration:4.0s;animation-delay:0s"></span>
  <span class="coin" style="left:40px;width:8px;height:8px;animation-duration:4.7s;animation-delay:-1.3s"></span>
  <span class="coin" style="left:75px;width:10px;height:10px;animation-duration:5.4s;animation-delay:-2.6s"></span>
  <span class="coin" style="left:118px;width:6px;height:6px;animation-duration:6.1s;animation-delay:-3.9s"></span>
  <span class="coin" style="left:150px;width:8px;height:8px;animation-duration:6.8s;animation-delay:-5.2s"></span>
  <span class="coin" style="left:186px;width:10px;height:10px;animation-duration:4.5s;animation-delay:-.5s"></span>
  <span class="coin" style="left:215px;width:6px;height:6px;animation-duration:5.2s;animation-delay:-1.8s"></span>
  <span class="coin" style="left:232px;width:8px;height:8px;animation-duration:5.9s;animation-delay:-3.1s"></span>
  <span class="coin" style="left:60px;width:10px;height:10px;animation-duration:6.6s;animation-delay:-4.4s"></span>
  <span class="coin" style="left:170px;width:6px;height:6px;animation-duration:4.3s;animation-delay:-5.7s"></span>
  <div class="tile"><span class="coinicon"></span></div>
  <div class="sum">Earn AED 3,000</div>
  <div class="btn">Refer a friend</div>
</a>

</body>
</html>
