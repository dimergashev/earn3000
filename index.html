<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earn AED 3,000 · referral badge</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700&family=Outfit:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeicons@7.0.0/primeicons.css">
<style>
  :root{--maroon:#6a2135;--cream:#f5ece0;--navy:#051634;--gold:#f7ce78}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf6f0;font-family:'Manrope',sans-serif}

  /* ===== Referral badge · A4 maroon ===== */
  .referral-badge{position:relative;width:248px;padding:16px 18px;border-radius:22px;background:var(--maroon);color:#fff;display:flex;flex-direction:column;overflow:hidden;cursor:pointer}
  .referral-badge .tile{width:44px;height:44px;border-radius:50%;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 0 6px rgba(247,206,120,.18)}
  .referral-badge .sum{margin-top:12px;font-family:'Outfit',sans-serif;font-weight:800;font-size:27px;line-height:1.05;letter-spacing:-.02em;color:var(--gold);white-space:nowrap}
  .referral-badge .btn{position:relative;overflow:hidden;margin-top:14px;height:40px;border-radius:12px;background:var(--cream);color:var(--maroon);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;line-height:20px}
  .referral-badge .st{position:absolute;font-size:9px;color:var(--gold)}
  .referral-badge .dot{position:absolute;border-radius:50%}

  /* animation: twinkle + shimmer CTA */
  @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}
  @keyframes shimmer{0%{transform:translateX(-160%) skewX(-20deg)}100%{transform:translateX(260%) skewX(-20deg)}}
  .referral-badge .st,.referral-badge .dot{animation:twinkle 2.4s ease-in-out infinite}
  .referral-badge .btn::after{content:'';position:absolute;top:-10px;bottom:-10px;left:0;width:40%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));animation:shimmer 2.8s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.referral-badge *,.referral-badge .btn::after{animation:none!important}}
</style>
</head>
<body>

<a class="referral-badge" href="#" aria-label="Refer a friend, earn AED 3,000">
  <i class="pi pi-star-fill st" style="left:16px;top:10px;animation-delay:0s"></i>
  <i class="pi pi-star-fill st" style="right:76px;top:12px;font-size:7px;animation-delay:.37s"></i>
  <i class="pi pi-star-fill st" style="right:18px;bottom:12px;font-size:8px;animation-delay:.74s"></i>
  <i class="pi pi-star-fill st" style="left:60px;bottom:10px;font-size:7px;color:#fff;opacity:.5;animation-delay:1.11s"></i>
  <span class="dot" style="width:4px;height:4px;background:#fff;left:44px;top:8px;opacity:.6;animation-delay:1.48s"></span>
  <span class="dot" style="width:5px;height:5px;background:var(--cream);right:46px;top:30px;animation-delay:1.85s"></span>
  <span class="dot" style="width:4px;height:4px;background:var(--gold);left:110px;top:14px;animation-delay:2.22s"></span>
  <div class="tile"><i class="pi pi-gift"></i></div>
  <div class="sum">Earn AED 3,000</div>
  <div class="btn">Refer a friend</div>
</a>

</body>
</html>
